[project]
name = "aether-backend"
version = "0.1.0"
description = "AETHER Studio backend - physics-grounded digital twin from video"
requires-python = ">=3.10"
dependencies = [
    # Core API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "websockets>=12.0.0",
    "msgpack>=1.0.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",

    # Numeric / ML
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "torch>=2.3.0",
    "torchvision>=0.18.0",
    "timm>=1.0.0",
    "jax>=0.4.20",
    "jaxlib>=0.4.20",
    "optax>=0.1.7",
    "mujoco>=3.0.0",
    "kfac-jax>=0.0.4",

    # Video processing
    "opencv-python>=4.10.0",
    "av>=12.0.0",
    "pillow>=10.0.0",

    # Networking / HTTP
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.0.0",

    # System
    "psutil>=6.0.0",

    # Perception models (SAM 2)
    "sam2>=1.1.0",

    # CoTracker3
    "cotracker>=3.0",

    # HuggingFace utilities
    "huggingface-hub>=0.24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.hatch.build.targets.wheel]
packages = ["app"]
