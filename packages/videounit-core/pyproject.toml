[project]
name = "videounit-core"
version = "0.1.0"
description = "VideoUnit AI Video Testing Framework - Core SDK"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "av>=10.0",
    "chromadb>=0.4",
    "sentence-transformers>=2.2",
    "httpx>=0.24",
    "fastapi>=0.100",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "pillow>=10.0",
    "tensorizer>=2.4",
    "einops>=0.7",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.urls]
homepage = "https://github.com/videounit/videounit"
documentation = "https://docs.videounit.dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videounit"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
