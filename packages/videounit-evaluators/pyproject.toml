[project]
name = "videounit-evaluators"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "videounit-core",
    "torch>=2.0",
    "numpy>=1.24",
    "opencv-python>=4.8",
    "scenedetect>=0.6",
    "scikit-image>=0.21",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videounit_evaluators"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
