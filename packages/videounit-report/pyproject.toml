[project]
name = "videounit-report"
version = "0.1.0"
description = "VideoUnit AI Video Testing - Report Generation"
requires-python = ">=3.12"
dependencies = [
    "videounit-core",
    "pillow>=10.0",
    "pyyaml>=6.0",
    "rich>=13.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.1",
    "ruff>=0.1",
    "mypy>=1.5",
]

[project.urls]
homepage = "https://github.com/videounit/videounit"
documentation = "https://docs.videounit.dev"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videounit_report"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true
