[project]
name = "videounit-cli"
version = "0.1.0"
description = "VideoUnit CLI - AI video testing framework"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "httpx>=0.24",
    "pyyaml>=6.0",
    "click>=8.1",
    "uvicorn>=0.20",
    "python-multipart>=0.0.6",
]

[project.scripts]
videounit = "videounit_cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/videounit_cli"]
